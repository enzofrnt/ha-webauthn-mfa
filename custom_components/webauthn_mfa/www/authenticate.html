<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Passkey — Home Assistant</title>
    <style>
      :root {
        color-scheme: light;
        --primary-color: #03a9f4;
        --primary-background-color: #fafafa;
        --secondary-background-color: #e5e5e5;
        --card-background-color: #fff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --divider-color: #e0e0e0;
        --error-color: #db4437;
        --success-color: #43a047;
        --info-color: #039be5;
        --ha-border-radius-lg: 12px;
        --ha-border-radius-pill: 999px;
        --ha-font-family-body: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-family: var(--ha-font-family-body);
        -webkit-font-smoothing: antialiased;
      }

      .auth-shell {
        width: 100%;
        max-width: 400px;
      }

      .card-content {
        position: relative;
        width: 100%;
        padding: 16px;
        border: 1px solid var(--divider-color);
        border-radius: var(--ha-border-radius-lg);
        background: var(--card-background-color);
        box-shadow: none;
      }

      .auth-form {
        width: 100%;
        max-width: 336px;
        margin: 0 auto;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0 4px;
        color: var(--secondary-text-color);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: .2px;
      }

      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--primary-color) 14%, transparent);
        color: var(--primary-color);
      }

      .brand-mark svg { width: 20px; height: 20px; fill: currentColor; }

      h1 {
        margin: 16px 0 8px;
        color: var(--primary-text-color);
        font-size: 24px;
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: -.2px;
      }

      .subtitle {
        margin: 0 0 20px;
        color: var(--secondary-text-color);
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-line;
      }

      .remember-label {
        display: flex;
        align-items: center;
        width: fit-content;
        min-height: 40px;
        gap: 10px;
        margin: 0 0 12px;
        color: var(--primary-text-color);
        font-size: 14px;
        line-height: 1.4;
        text-align: start;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .remember-label input {
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: var(--primary-color);
        cursor: pointer;
      }

      .button {
        position: relative;
        min-height: 40px;
        padding: 8px 20px;
        border: 0;
        border-radius: var(--ha-border-radius-pill);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        cursor: pointer;
        transition: background-color 180ms ease-out, color 180ms ease-out;
        -webkit-tap-highlight-color: transparent;
      }

      .button:focus-visible {
        outline: 2px solid var(--primary-color);
        outline-offset: 2px;
      }

      .button:disabled { cursor: default; opacity: .65; }

      .button-primary {
        width: 100%;
        background: var(--primary-color);
        color: #fff;
      }

      .button-secondary {
        margin-top: 8px;
        background: transparent;
        color: var(--primary-color);
      }

      .button-content {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255,255,255,.4);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }

      .status {
        margin: 16px 0 0;
        padding: 12px 14px;
        border: 1px solid transparent;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.45;
        text-align: start;
      }

      .status[hidden] { display: none; }

      .status.info {
        border-color: color-mix(in srgb, var(--info-color) 35%, transparent);
        background: color-mix(in srgb, var(--info-color) 10%, transparent);
        color: var(--primary-text-color);
      }

      .status.success {
        border-color: color-mix(in srgb, var(--success-color) 35%, transparent);
        background: color-mix(in srgb, var(--success-color) 10%, transparent);
        color: var(--primary-text-color);
      }

      .status.error {
        border-color: color-mix(in srgb, var(--error-color) 35%, transparent);
        background: color-mix(in srgb, var(--error-color) 10%, transparent);
        color: var(--primary-text-color);
      }

      @media (hover: hover) {
        .button-primary:hover:not(:disabled) {
          background: color-mix(in srgb, var(--primary-color) 88%, #000);
        }
        .button-secondary:hover:not(:disabled) {
          background: color-mix(in srgb, var(--primary-color) 10%, transparent);
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --primary-background-color: #111;
          --secondary-background-color: #202020;
          --card-background-color: #1c1c1c;
          --primary-text-color: #e1e1e1;
          --secondary-text-color: #a0a0a0;
          --divider-color: #3a3a3a;
        }
      }

      @media (max-width: 450px) {
        body {
          align-items: flex-start;
          padding-top: max(16px, env(safe-area-inset-top));
        }
        .card-content { padding: 16px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
        .spinner { animation-duration: 1.6s; }
      }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <section class="card-content" aria-labelledby="t-title">
        <div class="auth-form">
          <div class="brand" aria-label="Home Assistant">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M7 14a5 5 0 1 1 4.9-6H22v4h-2v3h-3v3h-5.1A5 5 0 0 1 7 14Zm0-3a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/>
              </svg>
            </span>
            <span>Home Assistant</span>
          </div>

          <h1 id="t-title"></h1>
          <p class="subtitle" id="t-subtitle"></p>

          <label class="remember-label">
            <input type="checkbox" id="remember-me" checked>
            <span id="t-remember"></span>
          </label>

          <button class="button button-primary" id="btn-auth" type="button">
            <span class="button-content" id="btn-auth-content"></span>
          </button>
          <button class="button button-secondary" id="btn-back" type="button"></button>

          <div class="status" id="status" role="status" aria-live="polite" hidden></div>
        </div>
      </section>
    </main>

    <script>
      const T = {{I18N}};
      document.documentElement.lang = {{LANG}};
      document.title = `${T.title} — Home Assistant`;

      document.getElementById("t-title").textContent = T.title;
      document.getElementById("t-subtitle").textContent = T.subtitle;
      document.getElementById("t-remember").textContent = T.remember;
      document.getElementById("btn-auth-content").textContent = T.btnAuth;
      document.getElementById("btn-back").textContent = T.btnBack;

      const FLOW_ID = {{FLOW_ID}};
      const RETURN_URL = {{RETURN_URL}};
      const authButton = document.getElementById("btn-auth");

      authButton.addEventListener("click", startAuth);
      document.getElementById("btn-back").addEventListener("click", goBack);

      function setStatus(message, type = "info") {
        const status = document.getElementById("status");
        status.hidden = false;
        status.className = `status ${type}`;
        status.textContent = message;
      }

      function setLoading(loading) {
        const content = document.getElementById("btn-auth-content");
        authButton.disabled = loading;
        authButton.setAttribute("aria-busy", String(loading));
        content.replaceChildren();
        if (loading) {
          const spinner = document.createElement("span");
          spinner.className = "spinner";
          spinner.setAttribute("aria-hidden", "true");
          content.append(spinner, document.createTextNode(T.verifying));
        } else {
          content.textContent = T.btnAuth;
        }
      }

      function getSafeReturnUrl(fallback = "/") {
        const value = RETURN_URL ||
          new URLSearchParams(window.location.search).get("return_url") || "";
        if (!value) return fallback;
        try {
          const parsed = new URL(value, window.location.origin);
          if (parsed.origin !== window.location.origin) return fallback;
          return `${parsed.pathname}${parsed.search}${parsed.hash}`;
        } catch (_) {
          return fallback;
        }
      }

      function goBack() {
        sessionStorage.setItem("webauthn_bypass", "1");
        window.location.href = getSafeReturnUrl("/");
      }

      function bufferToBase64url(buffer) {
        return btoa(String.fromCharCode(...new Uint8Array(buffer)))
          .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      function base64urlToBuffer(value) {
        let base64 = value.replace(/-/g, "+").replace(/_/g, "/");
        while (base64.length % 4) base64 += "=";
        return Uint8Array.from(atob(base64), (character) => character.charCodeAt(0)).buffer;
      }

      async function startAuth() {
        if (!window.PublicKeyCredential) {
          setStatus(T.noSupport, "error");
          return;
        }

        setLoading(true);
        setStatus(T.fetchChallenge, "info");

        try {
          const challengeResponse = await fetch("/api/webauthn_mfa/challenge", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ flow_id: FLOW_ID }),
          });
          const options = await challengeResponse.json();
          if (!challengeResponse.ok) {
            setStatus(options.message || options.error || T.serverError, "error");
            setLoading(false);
            return;
          }

          options.challenge = base64urlToBuffer(options.challenge);
          if (options.allowCredentials) {
            options.allowCredentials = options.allowCredentials.map((credential) => ({
              ...credential,
              id: base64urlToBuffer(credential.id),
            }));
          }

          setStatus(T.waiting, "info");
          const credential = await navigator.credentials.get({ publicKey: options });
          setStatus(T.verifying, "info");

          const assertion = {
            id: credential.id,
            rawId: bufferToBase64url(credential.rawId),
            type: credential.type,
            response: {
              authenticatorData: bufferToBase64url(credential.response.authenticatorData),
              clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
              signature: bufferToBase64url(credential.response.signature),
              userHandle: credential.response.userHandle
                ? bufferToBase64url(credential.response.userHandle)
                : null,
            },
          };

          let username = "";
          if (credential.response.userHandle) {
            username = new TextDecoder().decode(credential.response.userHandle);
          }

          const verifyResponse = await fetch("/api/webauthn_mfa/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ flow_id: FLOW_ID, username, response: assertion }),
          });
          const verifyData = await verifyResponse.json();

          if (verifyData.success && verifyData.token) {
            setStatus(T.verified, "success");
            setLoading(false);
            const rememberMe = document.getElementById("remember-me")?.checked ?? true;
            sessionStorage.setItem("webauthn_pending_token", JSON.stringify({
              token: verifyData.token,
              flow_id: FLOW_ID,
              remember_me: rememberMe,
            }));
            setTimeout(() => {
              window.location.href = getSafeReturnUrl("/auth/authorize");
            }, 300);
          } else {
            setStatus(`${T.failed}: ${verifyData.error || T.unknown}`, "error");
            setLoading(false);
          }
        } catch (err) {
          setStatus(
            err.name === "NotAllowedError" ? T.cancelled : `${T.error}: ${err.message}`,
            "error"
          );
          setLoading(false);
        }
      }
    </script>
  </body>
</html>
